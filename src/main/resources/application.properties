spring.application.name=compass-bank

# Threads virtuais (Java 21 - Project Loom)
spring.threads.virtual.enabled=true

# DataSource - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/compassbank
spring.datasource.username=compassbank
spring.datasource.password=compassbank
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=compass-bank-notificacoes
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.cordeirops.compassbank.domain.event
spring.kafka.consumer.properties.spring.json.type.mapping=transferenciaConcluidaEvent:org.cordeirops.compassbank.domain.event.TransferenciaConcluidaEvent

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.cordeirops.compassbank=INFO
logging.level.org.springframework.kafka=WARN
